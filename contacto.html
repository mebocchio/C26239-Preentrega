<form action="#" method="post">
    
   <!-- Campos del formulario -->
 <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required><br>

    <label for="correo">Correo electronico:</label>
    <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required><br>
  
    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí" required></textarea><br>
  
<!-- Botones de acción -->
<button type="submit">Enviar</button>
<button type="reset">Borrar</button>
<button onclick="window.history.back();">Volver atras</button>
</form>
